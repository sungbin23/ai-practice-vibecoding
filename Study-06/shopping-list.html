<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쇼핑 리스트</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1f2328; --muted: #6b7280;
    --line: #e5e7eb; --accent: #2563eb; --danger: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --card: #1a1f25; --text: #e6e8eb; --muted: #9aa3ad; --line: #2a313a; --accent: #60a5fa; --danger: #f87171; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "Malgun Gothic", sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 480px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .summary { color: var(--muted); font-size: .9rem; margin: 0 0 16px; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type=text] { flex: 1; padding: 10px 12px; font-size: 1rem; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); }
  input[type=text]:focus { outline: 2px solid var(--accent); border-color: transparent; }
  button { font: inherit; cursor: pointer; border-radius: 8px; }
  .add { padding: 10px 16px; border: 0; background: var(--accent); color: #fff; font-weight: 600; }
  ul { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  li label { flex: 1; display: flex; align-items: center; gap: 10px; cursor: pointer; word-break: break-word; }
  li input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
  li.done .name { text-decoration: line-through; color: var(--muted); }
  .del { border: 0; background: none; color: var(--muted); font-size: 1.1rem; padding: 4px 8px; }
  .del:hover { color: var(--danger); }
  .empty { padding: 24px; text-align: center; color: var(--muted); }
  .clear { margin-top: 12px; border: 1px solid var(--line); background: var(--card); color: var(--muted); padding: 8px 12px; }
  .clear:hover { color: var(--danger); border-color: var(--danger); }
  .clear[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1>🛒 쇼핑 리스트</h1>
  <p class="summary" id="summary"></p>

  <form id="form">
    <input type="text" id="input" placeholder="살 물건을 입력하세요" maxlength="100" autocomplete="off" aria-label="아이템 이름">
    <button type="submit" class="add">추가</button>
  </form>

  <ul id="list"></ul>
  <button type="button" class="clear" id="clear" hidden>체크한 항목 모두 삭제</button>
</main>

<script>
  const KEY = 'shopping-list-items';
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const list = document.getElementById('list');
  const summary = document.getElementById('summary');
  const clearBtn = document.getElementById('clear');

  let items = load();

  function load() {
    try {
      const data = JSON.parse(localStorage.getItem(KEY));
      return Array.isArray(data) ? data : [];
    } catch { return []; }
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(items)); } catch {}
  }

  function render() {
    list.replaceChildren();
    if (items.length === 0) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = '아직 아이템이 없어요. 위에서 추가해 보세요.';
      list.append(li);
    }
    for (const item of items) {
      const li = document.createElement('li');
      if (item.done) li.classList.add('done');

      const label = document.createElement('label');
      const check = document.createElement('input');
      check.type = 'checkbox';
      check.checked = item.done;
      check.addEventListener('change', () => { item.done = check.checked; update(); });
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = item.name;
      label.append(check, name);

      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'del';
      del.textContent = '✕';
      del.setAttribute('aria-label', `${item.name} 삭제`);
      del.addEventListener('click', () => { items = items.filter(i => i.id !== item.id); update(); });

      li.append(label, del);
      list.append(li);
    }
    const doneCount = items.filter(i => i.done).length;
    summary.textContent = items.length ? `전체 ${items.length}개 · 완료 ${doneCount}개` : '';
    clearBtn.hidden = doneCount === 0;
  }

  function update() { save(); render(); }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const name = input.value.trim();
    if (!name) { input.focus(); return; }
    items.push({ id: Date.now() + Math.random(), name, done: false });
    input.value = '';
    input.focus();
    update();
  });

  // 한글 조합 중 Enter로 글자가 두 번 들어가는 것 방지
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.isComposing) e.preventDefault();
  });

  clearBtn.addEventListener('click', () => { items = items.filter(i => !i.done); update(); });

  render();
</script>
</body>
</html>
