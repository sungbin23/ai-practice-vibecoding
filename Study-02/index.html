<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-container">
        <div class="header-container">
            <div class="title-group">
                <h1>My Tasks</h1>
                <span id="remainingBadge" class="remaining-badge">0개 남음</span>
            </div>
            <button id="themeToggle" title="다크 모드 전환 (Alt+D)" aria-label="다크 모드 전환 (Alt+D)" aria-pressed="false">🌙</button>
        </div>

        <section class="dashboard" aria-label="진행률 대시보드">
            <div class="dashboard-header">
                <div>
                    <div class="stat-label">전체 진행률</div>
                    <div class="stat-value" id="overallText">0/0 완료 (0%)</div>
                </div>
                <div style="text-align: right;">
                    <div class="stat-label">오늘 추가</div>
                    <div class="stat-value" id="todayCount">0개</div>
                </div>
            </div>
            <div class="progress-bar-bg" role="progressbar" aria-label="전체 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-bar-fill" id="overallProgress"></div></div>
            <!-- 완료율 응원 메시지 -->
            <div id="cheerMessage" class="cheer-message"></div>

            <div class="category-stats">
                <div class="cat-stat work-stat"><div class="cat-stat-header"><span>업무</span><span id="workText">0/0</span></div><div class="mini-progress-bg" role="progressbar" aria-label="업무 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="mini-progress-fill work-fill" id="workProgress"></div></div></div>
                <div class="cat-stat personal-stat"><div class="cat-stat-header"><span>개인</span><span id="personalText">0/0</span></div><div class="mini-progress-bg" role="progressbar" aria-label="개인 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="mini-progress-fill personal-fill" id="personalProgress"></div></div></div>
                <div class="cat-stat study-stat"><div class="cat-stat-header"><span>공부</span><span id="studyText">0/0</span></div><div class="mini-progress-bg" role="progressbar" aria-label="공부 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="mini-progress-fill study-fill" id="studyProgress"></div></div></div>
            </div>
            <!-- 오늘의 격언 추가 -->
            <div id="quoteContainer" class="quote-container"></div>
        </section>

        <!-- 정렬 및 컨트롤 컨테이너 -->
        <div class="controls-container">
            <input type="search" id="searchInput" placeholder="할 일 검색... 🔍" aria-label="할 일 검색 (ESC로 지우기)">
            <select id="sortSelect" aria-label="정렬 방식">
                <option value="latest">최신순</option>
                <option value="oldest">오래된순</option>
                <option value="category">카테고리순</option>
                <option value="completed">완료순</option>
                <option value="manual">직접 정렬 (드래그)</option>
            </select>
        </div>

        <!-- 데이터 관리 버튼들 -->
        <div class="data-controls">
            <button id="exportBtn" class="data-btn" aria-label="JSON 파일로 내보내기">⬇ 내보내기</button>
            <button id="importBtn" class="data-btn" aria-label="JSON 파일에서 가져오기">⬆ 가져오기</button>
            <input type="file" id="importFile" accept=".json" style="display: none;" aria-hidden="true" tabindex="-1">
            <button id="clearCompletedBtn" class="data-btn danger">완료 항목 삭제</button>
        </div>

        <div class="filter-container" role="group" aria-label="카테고리 필터 (Alt+1~4)">
            <button class="filter-btn active" data-filter="all" aria-pressed="true">전체</button>
            <button class="filter-btn" data-filter="work" aria-pressed="false">업무</button>
            <button class="filter-btn" data-filter="personal" aria-pressed="false">개인</button>
            <button class="filter-btn" data-filter="study" aria-pressed="false">공부</button>
        </div>

        <div class="input-container">
            <select id="categorySelect" aria-label="새 할 일 카테고리">
                <option value="work">업무</option>
                <option value="personal">개인</option>
                <option value="study">공부</option>
            </select>
            <input type="text" id="taskInput" placeholder="새 할 일 입력 시 카테고리 자동 분류 (Alt+N)" aria-label="새로운 할 일 (Alt+N)" maxlength="200">
            <button id="addBtn">추가</button>
        </div>
        <!-- 키워드 기반 자동 카테고리 분류 안내 -->
        <div id="autoCategoryHint" class="auto-category-hint" aria-live="polite"></div>
        <ul id="taskList" aria-label="할 일 목록"></ul>
    </main>

    <!-- 삭제 실행 취소 알림 -->
    <div id="undoToast" class="undo-toast" hidden>
        <span id="undoText"></span>
        <button id="undoBtn" type="button">실행 취소</button>
    </div>

    <!-- 스크린 리더 안내 영역 -->
    <div id="srStatus" class="sr-only" role="status" aria-live="polite"></div>

    <script src="script.js"></script>
</body>
</html>
