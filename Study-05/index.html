<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 공감 다이어리</title>
<style>
:root{
  --paper:#fbf5e9; --card:#fffdf8; --line:#ead9bf; --ink:#4a3728; --sub:#7a6450;
  --accent:#c2703d; --accent-d:#a55a2b; --peach:#fde6d3; --sand:#f3e6cf; --danger:#a63a2a; --danger-bg:#fbe4df;
  --shadow:0 4px 16px rgba(120,80,40,.10);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);line-height:1.6;
  font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","Segoe Print","Comic Sans MS",system-ui,sans-serif;
  background-image:repeating-linear-gradient(transparent,transparent 31px,rgba(194,112,61,.06) 32px)}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 64px}
header{text-align:center;padding:12px 0 8px}
h1{margin:0;font-size:1.7rem;letter-spacing:-.02em}
.date{margin:4px 0 0;color:var(--sub);font-size:.95rem}
.banner{margin:12px 0;padding:10px 14px;background:var(--peach);border:1px solid #f0c9a6;border-radius:14px;text-align:center;font-weight:600;color:var(--accent-d)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px}
form{margin-top:12px}
label{display:block;font-weight:700;margin-bottom:8px}
.row{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;min-height:48px;padding:10px 14px;font:inherit;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:14px}
input[type=text]:focus{outline:3px solid #e9b98f;border-color:var(--accent)}
button{font:inherit;cursor:pointer;min-height:44px;min-width:44px;border-radius:14px;border:0}
button:focus-visible{outline:3px solid #e9b98f;outline-offset:2px}
.primary{padding:0 18px;background:var(--accent);color:#fff;font-weight:700}
.primary:hover:not(:disabled){background:var(--accent-d)}
button:disabled{opacity:.55;cursor:not-allowed}
.meta{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:.88rem;color:var(--sub)}
.counter.over{color:var(--danger);font-weight:700}
.loading{display:none;margin-top:10px;color:var(--accent-d);font-weight:600}
.loading.on{display:block}
.loading::before{content:"";display:inline-block;width:.9em;height:.9em;margin-right:8px;border:2px solid var(--accent);border-right-color:transparent;border-radius:50%;vertical-align:-1px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error{display:none;margin-top:12px;padding:10px 14px;background:var(--danger-bg);color:var(--danger);border:1px solid #efbdb3;border-radius:12px}
.error.on{display:block}
.result{margin-top:16px;background:linear-gradient(180deg,#fff7ec,var(--card))}
.result:empty{display:none}
.emo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.emo .big{font-size:2.2rem;line-height:1}
.emo .name{font-size:1.25rem;font-weight:700}
.hearts{letter-spacing:2px;color:var(--accent)}
.hearts .off{color:#b59a7c}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.retry{margin-top:8px;padding:0 16px;background:var(--sand);color:var(--ink);border:1px solid var(--line)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;padding:0;list-style:none}
.tags li{background:var(--sand);border-radius:999px;padding:2px 12px;font-size:.88rem}
.empathy{margin:8px 0}
.comfort{margin:10px 0 0;padding:10px 14px;background:var(--peach);border-radius:12px;font-weight:600}
.demo-tag{font-size:.75rem;background:var(--sand);color:var(--sub);border-radius:999px;padding:1px 8px}
h2{font-size:1.1rem;margin:28px 0 4px}
.day{margin:20px 0 8px;padding-bottom:4px;border-bottom:2px dashed var(--line);font-weight:700;color:var(--accent-d)}
ul.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.entry{position:relative;padding:12px 14px}
.entry .top{display:flex;align-items:flex-start;gap:8px}
.entry .time{font-size:.85rem;color:var(--sub)}
.entry .txt{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}
.entry .em{font-size:1.5rem;line-height:1}
.entry .small{margin:6px 0 0;font-size:.92rem;color:var(--sub);overflow-wrap:anywhere}
.del{background:transparent;color:var(--sub);border:1px solid var(--line);padding:0 10px;font-size:.85rem}
.del:hover:not(:disabled){background:var(--danger-bg);color:var(--danger)}
.empty{text-align:center;color:var(--sub);padding:28px 12px}
.flash{animation:flash 1.6s ease}
@keyframes flash{from{background:var(--peach)}to{background:var(--card)}}
@media (max-width:420px){h1{font-size:1.45rem}.primary{padding:0 12px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📖 AI 공감 다이어리</h1>
    <p class="date" id="today"></p>
  </header>
  <div id="banner" class="banner" hidden>데모 모드: API 키 없음</div>

  <form id="form" class="card" novalidate>
    <label for="text">오늘의 한 줄</label>
    <div class="row">
      <input type="text" id="text" autocomplete="off" placeholder="오늘 있었던 일을 한 줄로 적어 보세요" aria-describedby="hint counter">
      <button type="submit" id="submit" class="primary" disabled>기록하기</button>
    </div>
    <div class="meta"><span id="hint">1~200자로 적어 주세요.</span><span id="counter" class="counter">0/200</span></div>
    <div id="loading" class="loading" role="status" aria-live="polite"></div>
    <div id="error" class="error" role="alert"></div>
  </form>

  <section id="result" class="card result" aria-live="polite" aria-label="감정 분석 결과"></section>

  <h2>지난 기록</h2>
  <div id="entries"></div>
  <div id="sr" class="sr" role="status" aria-live="polite"></div>
</div>

<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  var input=$('text'), btn=$('submit'), counter=$('counter'), loading=$('loading'),
      errBox=$('error'), result=$('result'), entriesBox=$('entries');
  var DAYS=['일','월','화','수','목','금','토'];
  var busy=false, entries=[], resultId=null, sr=$('sr');
  function say(m){sr.textContent='';setTimeout(function(){sr.textContent=m;},50);}

  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});
  }
  function dayLabel(d){return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+DAYS[d.getDay()]+')';}
  function dayKey(d){return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();}
  function pad(n){return n<10?'0'+n:''+n;}
  function timeLabel(d){return pad(d.getHours())+':'+pad(d.getMinutes());}
  function snippet(t){var c=[...String(t)];return c.length>15?c.slice(0,15).join('')+'…':c.join('');}
  function hearts(n){
    n=Math.max(0,Math.min(5,Math.round(Number(n)||0)));
    return '<span class="hearts" role="img" aria-label="강도 '+n+'/5">'+
      '♥'.repeat(n)+'<span class="off">'+'♥'.repeat(5-n)+'</span></span>';
  }

  $('today').textContent='오늘은 '+dayLabel(new Date());

  function showError(msg){errBox.textContent=msg;errBox.classList.add('on');}
  function clearError(){errBox.textContent='';errBox.classList.remove('on');}

  function validate(){
    var len=[...input.value.trim()].length, raw=[...input.value].length;
    counter.textContent=raw+'/200';
    var over=len>200||raw>200;
    counter.classList.toggle('over',over);
    btn.disabled=busy||len<1||over;
    return !btn.disabled;
  }

  function api(method,url,body){
    var opt={method:method,headers:{}};
    if(body){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body);}
    return fetch(url,opt).then(function(r){
      return r.json().catch(function(){return {};}).then(function(j){
        if(!r.ok){var e=new Error(j.error||('요청을 처리하지 못했어요. (오류 '+r.status+')'));e.api=true;e.status=r.status;throw e;}
        return j;
      });
    });
  }
  function errMsg(e){
    return e&&e.api?e.message:'서버에 연결할 수 없어요. npm start로 서버를 실행해 주세요.';
  }

  function renderResult(en){
    resultId=en.id;
    var a=en.analysis||{};
    var tags=(Array.isArray(a.keywords)?a.keywords:[]).map(function(k){return '<li>#'+escapeHtml(k)+'</li>';}).join('');
    result.innerHTML=
      '<div class="emo"><span class="big" aria-hidden="true">'+escapeHtml(a.emoji)+'</span>'+
      '<span class="name">'+escapeHtml(a.emotion)+'</span>'+hearts(a.intensity)+
      (en.demo?' <span class="demo-tag">데모</span>':'')+'</div>'+
      (tags?'<ul class="tags" aria-label="키워드">'+tags+'</ul>':'')+
      '<p class="empathy">'+escapeHtml(a.empathy)+'</p>'+
      '<p class="comfort">💌 '+escapeHtml(a.comfort)+'</p>';
  }

  function renderEntries(scrollToId){
    entriesBox.textContent='';
    if(!entries.length){
      var p=document.createElement('p');p.className='empty card';
      p.textContent='아직 기록이 없어요. 오늘 하루를 한 줄로 남겨 볼까요? 🌱';
      entriesBox.appendChild(p);return;
    }
    var lastKey=null,ul=null,target=null;
    entries.forEach(function(en){
      var d=new Date(en.createdAt),k=dayKey(d);
      if(k!==lastKey){
        lastKey=k;
        var h=document.createElement('h3');h.className='day';h.textContent=dayLabel(d);
        entriesBox.appendChild(h);
        ul=document.createElement('ul');ul.className='list';entriesBox.appendChild(ul);
      }
      var a=en.analysis||{};
      var li=document.createElement('li');li.className='card entry';li.id='e-'+en.id;
      li.innerHTML=
        '<div class="top"><span class="em" aria-hidden="true">'+escapeHtml(a.emoji)+'</span>'+
        '<div class="txt">'+escapeHtml(en.text)+
        '<div class="time">'+timeLabel(d)+' · '+escapeHtml(a.emotion)+' '+hearts(a.intensity)+'</div></div>'+
        '<button type="button" class="del" data-id="'+escapeHtml(en.id)+'" aria-label="'+escapeHtml(snippet(en.text))+' 일기 삭제">삭제</button></div>'+
        '<p class="small">'+escapeHtml(a.comfort)+'</p>';
      ul.appendChild(li);
      if(en.id===scrollToId)target=li;
    });
    if(target){
      target.classList.add('flash');
      var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
      target.scrollIntoView({behavior:reduce?'auto':'smooth',block:'center'});
    }
  }

  function loadFail(msg){
    entriesBox.textContent='';
    var p=document.createElement('p');p.className='empty card';p.textContent=msg;
    var b=document.createElement('button');b.type='button';b.className='retry';b.textContent='다시 시도';
    b.addEventListener('click',load);
    p.appendChild(document.createElement('br'));p.appendChild(b);
    entriesBox.appendChild(p);
  }
  function load(){
    clearError();
    api('GET','/api/entries').then(function(j){
      entries=j.entries||[];renderEntries();
    }).catch(function(e){loadFail(errMsg(e));});
    api('GET','/api/status').then(function(s){
      $('banner').hidden=!s.demo;
    }).catch(function(e){showError(errMsg(e));});
  }

  input.addEventListener('input',function(){validate();});
  input.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&(e.isComposing||e.keyCode===229))e.preventDefault();
  });

  $('form').addEventListener('submit',function(e){
    e.preventDefault();
    if(busy||!validate())return;
    var text=input.value.trim();
    busy=true;clearError();btn.disabled=true;input.readOnly=true;
    loading.textContent='마음을 읽고 있어요…';loading.classList.add('on');
    api('POST','/api/entries',{text:text}).then(function(j){
      var en=j.entry;entries.push(en);
      input.value='';renderResult(en);renderEntries(en.id);say('새 일기를 기록했어요.');
    }).catch(function(err){
      showError(errMsg(err));
    }).then(function(){
      busy=false;input.readOnly=false;loading.classList.remove('on');loading.textContent='';
      validate();
    });
  });

  entriesBox.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('.del');
    if(!b)return;
    if(!confirm('이 일기를 삭제할까요?'))return;
    var id=b.getAttribute('data-id');
    b.disabled=true;clearError();
    function removeLocal(){
      var idx=entries.findIndex(function(x){return x.id===id;});
      entries=entries.filter(function(x){return x.id!==id;});
      if(resultId===id){resultId=null;result.innerHTML='';}
      renderEntries();
      var btns=entriesBox.querySelectorAll('.del');
      if(btns.length)btns[Math.min(Math.max(idx,0),btns.length-1)].focus();else input.focus();
      say('일기를 삭제했어요.');
    }
    api('DELETE','/api/entries/'+encodeURIComponent(id)).then(removeLocal).catch(function(err){
      if(err&&err.status===404){removeLocal();return;}
      b.disabled=false;showError(errMsg(err));
    });
  });

  validate();load();
})();
</script>
</body>
</html>
